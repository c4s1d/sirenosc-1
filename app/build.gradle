plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aphidaks.sirenosc'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aphidaks.sirenosc'
        minSdk 29
        targetSdk 34
        versionCode 10000
        versionName '1.4.0'
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'sirenosc'
            keyAlias 'sirenosc'
            keyPassword 'sirenosc'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }

    // Stored uncompressed: faster first load (no inflate of the 12 MB page), at the cost of a bigger APK.
    androidResources {
        noCompress 'html', 'oscp', 'json'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
